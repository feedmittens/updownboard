settings:
  poll_interval: 30       # seconds between check cycles
  history_limit: 500      # max state-change events stored in the DB

systems:
  - name: "Router"
    host: "10.0.0.1"
    checks:
      - type: ping
      - type: snmp
        community: "public"
        oid: "1.3.6.1.2.1.1.1.0"   # sysDescr — confirms SNMP is up

  - name: "Proxmox Host"
    host: "10.0.0.10"
    checks:
      - type: ping
      - type: tcp
        port: 22
        label: "SSH"
      - type: http
        url: "https://10.0.0.10:8006"
        expect_status: 200
        label: "Web UI"

  - name: "Linux Server"
    host: "10.0.0.20"
    checks:
      - type: ping
      - type: tcp
        port: 22
      - type: ssh_metrics
        username: monitor
        key_file: "~/.ssh/id_rsa"
        thresholds:
          cpu_percent: 90       # alert if 1-min load avg > 90% of core count
          memory_percent: 90
          disk_percent: 85

  - name: "Windows Machine"
    host: "10.0.0.30"
    checks:
      - type: ping
      - type: tcp
        port: 3389
        label: "RDP"
